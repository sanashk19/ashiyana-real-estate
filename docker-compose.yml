version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgis
    container_name: ashiyana_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashiyana9999
      POSTGRES_DB: ashiyana
    ports:
      - "5432:5432"
    volumes:
      - ashiyana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ashiyana_api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ashiyana_pgdata:
